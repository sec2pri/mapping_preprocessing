name: Check and test ChEBI updates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/chebi.yml'
      - '.github/ISSUE_TEMPLATE/ISSUE_DATA.md'
      - '.github/ISSUE_TEMPLATE/ISSUE_UPDATE.md'
      - '.github/ISSUE_TEMPLATE/ISSUE_FAIL.md'
      - 'java/src/org/sec2pri/chebi_sdf.java'
      - 'java/src/org/sec2pri/MappingRecord.java'
      - 'java/src/org/sec2pri/MappingOutput.java'
      - 'datasources/chebi/config'
  schedule:
    - cron: '0 0 1,15 * *'

permissions:
  contents: write
  issues: write

jobs:
  check_new_release:
    name: Check latest ChEBI release
    runs-on: ubuntu-latest
    outputs:
      RELEASE_NUMBER: ${{ steps.check_release.outputs.RELEASE_NUMBER }}
      CURRENT_RELEASE_NUMBER: ${{ steps.check_release.outputs.CURRENT_RELEASE_NUMBER }}
      NEW_RELEASE: ${{ steps.check_release.outputs.NEW_RELEASE }}
      DATE_NEW: ${{ steps.check_release.outputs.DATE_NEW }}
      DATE_OLD: ${{ steps.check_release.outputs.DATE_OLD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for new ChEBI release
        id: check_release
        shell: bash
        run: |
          set -euo pipefail

          . datasources/chebi/config

          current_release="$release"
          date_old="$date"

          echo "CURRENT_RELEASE_NUMBER=$current_release" >> "$GITHUB_OUTPUT"
          echo "DATE_OLD=$date_old" >> "$GITHUB_OUTPUT"

          wget -q \
            'http://ftp.ebi.ac.uk/pub/databases/chebi/archive/' \
            -O chebi_index.html

          release_new=$(
            grep -oP 'href="rel\K[0-9]+(?=/")' chebi_index.html \
              | sort -n \
              | tail -n 1
          )

          if [ -z "$release_new" ]; then
            echo 'ERROR: Could not determine the latest ChEBI release.'
            exit 1
          fi

          release_line=$(
            grep "href=\"rel${release_new}/\"" chebi_index.html \
              | tail -n 1
          )

          date_new=$(
            printf '%s\n' "$release_line" \
              | grep -oP '[0-9]{4}-[0-9]{2}-[0-9]{2}' \
              | head -n 1
          )

          if [ -z "$date_new" ]; then
            echo 'ERROR: Could not determine the latest ChEBI release date.'
            exit 1
          fi

          echo "RELEASE_NUMBER=$release_new" >> "$GITHUB_OUTPUT"
          echo "DATE_NEW=$date_new" >> "$GITHUB_OUTPUT"

          echo "Configured release: $current_release"
          echo "Latest release: $release_new"
          echo "Latest release date: $date_new"

          if [ "$release_new" -gt "$current_release" ]; then
            sdf_url="http://ftp.ebi.ac.uk/pub/databases/chebi/archive/rel${release_new}/SDF/chebi_3_stars.sdf.gz"

            max_retries=5
            retry_count=0
            success=false

            while [ "$retry_count" -lt "$max_retries" ]; do
              response=$(
                curl \
                  --location \
                  --silent \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  "$sdf_url"
              )

              if [ "$response" = '200' ]; then
                success=true
                break
              fi

              retry_count=$((retry_count + 1))
              echo "Attempt $retry_count failed with HTTP $response."

              if [ "$retry_count" -lt "$max_retries" ]; then
                sleep 60
              fi
            done

            if [ "$success" = 'true' ]; then
              echo 'NEW_RELEASE=true' >> "$GITHUB_OUTPUT"
            else
              echo 'NEW_RELEASE=false' >> "$GITHUB_OUTPUT"
              echo 'ISSUE=true' >> "$GITHUB_ENV"
            fi
          else
            echo 'NEW_RELEASE=false' >> "$GITHUB_OUTPUT"
          fi

          rm -f chebi_index.html

      - name: Post issue about upstream data availability
        if: env.ISSUE == 'true'
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ChEBI
          RELEASE_NUMBER: ${{ steps.check_release.outputs.RELEASE_NUMBER }}
          URL_RELEASE: http://ftp.ebi.ac.uk/pub/databases/chebi/archive/rel${{ steps.check_release.outputs.RELEASE_NUMBER }}/SDF/
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/ISSUE_DATA.md
          update_existing: true

  test_sdf_processing:
    name: Test ChEBI release
    needs: check_new_release
    if: >-
      needs.check_new_release.outputs.NEW_RELEASE == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      RELEASE_NUMBER: ${{ needs.check_new_release.outputs.RELEASE_NUMBER }}
      CURRENT_RELEASE_NUMBER: ${{ needs.check_new_release.outputs.CURRENT_RELEASE_NUMBER }}
      DATE_NEW: ${{ needs.check_new_release.outputs.DATE_NEW }}
      DATE_OLD: ${{ needs.check_new_release.outputs.DATE_OLD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Download ChEBI SDF
        shell: bash
        run: |
          set -euo pipefail

          sdf_url="http://ftp.ebi.ac.uk/pub/databases/chebi/archive/rel${RELEASE_NUMBER}/SDF/chebi_3_stars.sdf.gz"

          wget \
            --tries=5 \
            --timeout=60 \
            "$sdf_url" \
            -O chebi_3_stars.sdf.gz

          test -s chebi_3_stars.sdf.gz
          ls -lh chebi_3_stars.sdf.gz

          gunzip chebi_3_stars.sdf.gz

          test -s chebi_3_stars.sdf
          ls -lh chebi_3_stars.sdf

      - name: Build Java preprocessing code
        shell: bash
        working-directory: java
        run: |
          set -euo pipefail

          mvn clean package assembly:single
          ls -lh target/

      - name: Process ChEBI SDF
        id: sdf_process
        shell: bash
        run: |
          set -euo pipefail

          input_file='chebi_3_stars.sdf'
          output_dir='datasources/chebi/recentData'
          jar_file='java/target/mapping_preprocessing-0.0.1-jar-with-dependencies.jar'

          test -s "$input_file"
          test -s "$jar_file"

          rm -rf "$output_dir"
          mkdir -p "$output_dir"

          java \
            -cp "$jar_file" \
            org.sec2pri.chebi_sdf \
            "$input_file" \
            "$output_dir" \
            "$RELEASE_NUMBER"

          find "$output_dir" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          required_files=(
            'ChEBI_priIDs.tsv'
            'ChEBI_secID2priID.tsv'
            'ChEBI_name2synonym.tsv'
            'ChEBI_secID2priID.bridge'
          )

          for file in "${required_files[@]}"; do
            path="$output_dir/$file"

            if [ ! -s "$path" ]; then
              echo "ERROR: Missing or empty output: $path"
              exit 1
            fi
          done

      - name: Validate ChEBI outputs
        shell: bash
        run: |
          set -euo pipefail

          output_dir='datasources/chebi/recentData'

          expected_primary_header='primaryID'
          expected_mapping_header=$(printf 'primaryID\tsecondaryID')
          expected_synonym_header=$(printf 'primaryID\tname\tsynonym')

          actual_primary_header=$(head -n 1 "$output_dir/ChEBI_priIDs.tsv" | tr -d '\r')
          actual_mapping_header=$(head -n 1 "$output_dir/ChEBI_secID2priID.tsv" | tr -d '\r')
          actual_synonym_header=$(head -n 1 "$output_dir/ChEBI_name2synonym.tsv" | tr -d '\r')

          [ "$actual_primary_header" = "$expected_primary_header" ]
          [ "$actual_mapping_header" = "$expected_mapping_header" ]
          [ "$actual_synonym_header" = "$expected_synonym_header" ]

          primary_count=$(tail -n +2 "$output_dir/ChEBI_priIDs.tsv" | wc -l | tr -d ' ')
          mapping_count=$(tail -n +2 "$output_dir/ChEBI_secID2priID.tsv" | wc -l | tr -d ' ')
          synonym_count=$(tail -n +2 "$output_dir/ChEBI_name2synonym.tsv" | wc -l | tr -d ' ')

          echo "Primary IDs: $primary_count"
          echo "Secondary ID mappings: $mapping_count"
          echo "Name/synonym mappings: $synonym_count"

          if [ "$primary_count" -eq 0 ]; then
            echo 'ERROR: No primary IDs were generated.'
            exit 1
          fi

          if [ "$mapping_count" -eq 0 ]; then
            echo 'ERROR: No secondary-to-primary mappings were generated.'
            exit 1
          fi

          if [ "$synonym_count" -eq 0 ]; then
            echo 'ERROR: No name/synonym mappings were generated.'
            exit 1
          fi

          chebi_pattern='^CHEBI:[0-9]+$'

          tail -n +2 "$output_dir/ChEBI_priIDs.tsv" \
            | cut -f1 \
            | tr -d '\r' \
            > primary_ids.txt

          tail -n +2 "$output_dir/ChEBI_secID2priID.tsv" \
            | cut -f1 \
            | tr -d '\r' \
            > mapping_primary_ids.txt

          tail -n +2 "$output_dir/ChEBI_secID2priID.tsv" \
            | cut -f2 \
            | tr -d '\r' \
            > secondary_ids.txt

          validate_ids() {
            file="$1"
            label="$2"

            if grep -nvE "$chebi_pattern" "$file" > invalid_ids.txt; then
              echo "ERROR: Invalid $label detected."
              head -n 50 invalid_ids.txt
              exit 1
            fi
          }

          validate_ids primary_ids.txt 'primary IDs'
          validate_ids mapping_primary_ids.txt 'mapping primary IDs'
          validate_ids secondary_ids.txt 'secondary IDs'

          sort -u primary_ids.txt > all_primary_ids.txt
          sort -u mapping_primary_ids.txt > mapped_primary_ids.txt
          comm -23 mapped_primary_ids.txt all_primary_ids.txt > missing_primary_ids.txt

          if [ -s missing_primary_ids.txt ]; then
            echo 'ERROR: Mapping file contains primary IDs absent from ChEBI_priIDs.tsv.'
            head -n 50 missing_primary_ids.txt
            exit 1
          fi

      - name: Compare with current mapping
        id: compare_mapping
        shell: bash
        run: |
          set -euo pipefail

          . datasources/chebi/config

          old_file="datasources/chebi/data/$to_check_from_zenodo"
          new_file="datasources/chebi/recentData/$to_check_from_zenodo"

          echo '======================================'
          echo 'Files used for comparison'
          echo '======================================'
          echo "OLD: $old_file"
          echo "NEW: $new_file"

          if [ ! -f "$old_file" ]; then
            echo 'Old comparison file is not available. Skipping comparison.'
            echo 'ADDED=0' >> "$GITHUB_ENV"
            echo 'REMOVED=0' >> "$GITHUB_ENV"
            echo 'COUNT=0' >> "$GITHUB_ENV"
            echo 'CHANGE=0.00' >> "$GITHUB_ENV"
            exit 0
          fi

          if [ ! -s "$new_file" ]; then
            echo 'ERROR: New comparison file is missing or empty.'
            exit 1
          fi

          old_header=$(head -n 1 "$old_file" | tr -d '\r')
          new_header=$(head -n 1 "$new_file" | tr -d '\r')
          expected_header=$(printf 'primaryID\tsecondaryID')

          printf 'OLD header: %s\n' "$old_header"
          printf 'NEW header: %s\n' "$new_header"

          if [ "$old_header" != "$expected_header" ]; then
            echo 'ERROR: Historical mapping file has an unexpected header.'
            printf 'Expected: %s\n' "$expected_header"
            printf 'Observed: %s\n' "$old_header"
            exit 1
          fi

          if [ "$new_header" != "$expected_header" ]; then
            echo 'ERROR: New mapping file has an unexpected header.'
            printf 'Expected: %s\n' "$expected_header"
            printf 'Observed: %s\n' "$new_header"
            exit 1
          fi

          tail -n +2 "$old_file" \
            | tr -d '\r' \
            | cut -f1,2 \
            | sed '/^[[:space:]]*$/d' \
            | sort -u \
            > mappings_old.txt

          tail -n +2 "$new_file" \
            | tr -d '\r' \
            | cut -f1,2 \
            | sed '/^[[:space:]]*$/d' \
            | sort -u \
            > mappings_new.txt

          old_count=$(wc -l < mappings_old.txt | tr -d ' ')
          new_count=$(wc -l < mappings_new.txt | tr -d ' ')

          echo "Old unique mappings: $old_count"
          echo "New unique mappings: $new_count"

          echo 'First 5 old mappings:'
          head -n 5 mappings_old.txt || true

          echo 'First 5 new mappings:'
          head -n 5 mappings_new.txt || true

          comm -13 mappings_old.txt mappings_new.txt > added.txt
          comm -23 mappings_old.txt mappings_new.txt > removed.txt

          count_added=$(wc -l < added.txt | tr -d ' ')
          count_removed=$(wc -l < removed.txt | tr -d ' ')
          count=$((count_added + count_removed))

          if [ "$old_count" -gt 0 ]; then
            change=$(
              awk \
                -v changed="$count" \
                -v total="$old_count" \
                'BEGIN { printf "%.2f", (100 * changed / total) }'
            )
          else
            change='0.00'
          fi

          echo "Old mappings: $old_count"
          echo "New mappings: $new_count"
          echo "Added mappings: $count_added"
          echo "Removed mappings: $count_removed"
          echo "Total changes: $count"
          echo "Change rate: ${change}%"

          echo 'Example added mappings:'
          if [ -s added.txt ]; then
            head -n 20 added.txt
          else
            echo 'None'
          fi

          echo 'Example removed mappings:'
          if [ -s removed.txt ]; then
            head -n 20 removed.txt
          else
            echo 'None'
          fi

          echo "ADDED=$count_added" >> "$GITHUB_ENV"
          echo "REMOVED=$count_removed" >> "$GITHUB_ENV"
          echo "COUNT=$count" >> "$GITHUB_ENV"
          echo "CHANGE=$change" >> "$GITHUB_ENV"

      - name: Upload processed ChEBI data
        uses: actions/upload-artifact@v4
        with:
          name: chebi_processed
          path: datasources/chebi/recentData/
          if-no-files-found: error

      - name: Create or update ChEBI update issue
        if: env.COUNT != '0' && env.COUNT != ''
        id: create_issue
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ChEBI
          RELEASE_NUMBER: ${{ env.RELEASE_NUMBER }}
          URL_RELEASE: http://ftp.ebi.ac.uk/pub/databases/chebi/archive/rel${{ env.RELEASE_NUMBER }}/SDF/
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/ISSUE_UPDATE.md
          update_existing: true

      - name: Bump issue with comment
        if: env.COUNT != '0' && env.COUNT != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.create_issue.outputs.number }}
          body: |
            Bump issue to notify about the changes in ChEBI data.

      - name: Post issue about failing preprocessing test
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ChEBI
          RELEASE_NUMBER: ${{ env.RELEASE_NUMBER }}
          URL_RELEASE: http://ftp.ebi.ac.uk/pub/databases/chebi/archive/rel${{ env.RELEASE_NUMBER }}/SDF/
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/ISSUE_FAIL.md
          update_existing: true
