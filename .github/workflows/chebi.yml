name: Check and test ChEBI updates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/chebi.yml'
      - 'java/src/org/sec2pri/chebi_sdf.java'
      - 'java/src/org/sec2pri/MappingRecord.java'
      - 'java/src/org/sec2pri/MappingOutput.java'
  schedule:
    - cron: "0 0 1,15 * *"

permissions:
  contents: write
  issues: write

jobs:
  check_new_release:
    runs-on: ubuntu-latest
    name: Check latest ChEBI release

    outputs:
      RELEASE_NUMBER: ${{ steps.check_release.outputs.RELEASE_NUMBER }}
      CURRENT_RELEASE_NUMBER: ${{ steps.check_release.outputs.CURRENT_RELEASE_NUMBER }}
      NEW_RELEASE: ${{ steps.check_release.outputs.NEW_RELEASE }}
      DATE_NEW: ${{ steps.check_release.outputs.DATE_NEW }}
      DATE_OLD: ${{ steps.check_release.outputs.DATE_OLD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for new ChEBI release
        id: check_release
        shell: bash
        run: |
          set -euo pipefail

          chmod +x datasources/chebi/config
          . datasources/chebi/config .

          current_release="$release"
          date_old="$date"

          echo "CURRENT_RELEASE_NUMBER=$current_release" >> "$GITHUB_OUTPUT"
          echo "DATE_OLD=$date_old" >> "$GITHUB_OUTPUT"

          echo "Accessing the ChEBI archive"

          wget -q \
            "http://ftp.ebi.ac.uk/pub/databases/chebi/archive/" \
            -O chebi_index.html

          release_new=$(
            grep -oP 'href="rel\K[0-9]+(?=/")' chebi_index.html |
            sort -n |
            tail -1
          )

          if [ -z "$release_new" ]; then
            echo "Could not determine the latest ChEBI release."
            exit 1
          fi

          release_line=$(
            grep "href=\"rel${release_new}/\"" chebi_index.html |
            tail -1
          )

          date_new=$(
            printf '%s\n' "$release_line" |
            grep -oP '[0-9]{4}-[0-9]{2}-[0-9]{2}' |
            head -1
          )

          echo "RELEASE_NUMBER=$release_new" >> "$GITHUB_OUTPUT"
          echo "DATE_NEW=$date_new" >> "$GITHUB_OUTPUT"

          echo "Current release: $current_release"
          echo "Latest release:  $release_new"
          echo "Current date:    $date_old"
          echo "Latest date:     $date_new"

          if [ "$release_new" -gt "$current_release" ]; then
            sdf_url="http://ftp.ebi.ac.uk/pub/databases/chebi/archive/rel${release_new}/SDF/chebi_3_stars.sdf.gz"

            echo "Checking:"
            echo "$sdf_url"

            max_retries=5
            retry_count=0
            success=false

            while [ "$retry_count" -lt "$max_retries" ]; do
              response=$(
                curl \
                  --location \
                  --silent \
                  --output /dev/null \
                  --write-out "%{http_code}" \
                  "$sdf_url"
              )

              if [ "$response" = "200" ]; then
                echo "ChEBI SDF is accessible."
                success=true
                break
              fi

              retry_count=$((retry_count + 1))
              echo "Attempt $retry_count failed with HTTP $response."

              if [ "$retry_count" -lt "$max_retries" ]; then
                sleep 60
              fi
            done

            if [ "$success" = true ]; then
              echo "NEW_RELEASE=true" >> "$GITHUB_OUTPUT"
            else
              echo "NEW_RELEASE=false" >> "$GITHUB_OUTPUT"
              echo "ISSUE=true" >> "$GITHUB_ENV"
            fi
          else
            echo "No new ChEBI release."
            echo "NEW_RELEASE=false" >> "$GITHUB_OUTPUT"
          fi

          rm -f chebi_index.html

      - name: Post issue about upstream data availability
        if: env.ISSUE == 'true'
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ChEBI
        with:
          filename: .github/ISSUE_TEMPLATE/ISSUE_DATA.md
          update_existing: true


  test_sdf_processing:
    name: Test ChEBI release
    needs: check_new_release

    # Run automatically for a new release.
    # Also run for workflow_dispatch and PR so the Java code can be tested
    # even when ChEBI has not published a new release.
    if: |
      needs.check_new_release.outputs.NEW_RELEASE == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    env:
      RELEASE_NUMBER: ${{ needs.check_new_release.outputs.RELEASE_NUMBER }}
      CURRENT_RELEASE_NUMBER: ${{ needs.check_new_release.outputs.CURRENT_RELEASE_NUMBER }}
      DATE_NEW: ${{ needs.check_new_release.outputs.DATE_NEW }}
      DATE_OLD: ${{ needs.check_new_release.outputs.DATE_OLD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Download ChEBI SDF
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing ChEBI release ${RELEASE_NUMBER}"

          sdf_url="http://ftp.ebi.ac.uk/pub/databases/chebi/archive/rel${RELEASE_NUMBER}/SDF/chebi_3_stars.sdf.gz"

          wget \
            --tries=5 \
            --timeout=60 \
            "$sdf_url" \
            -O chebi_3_stars.sdf.gz

          test -s chebi_3_stars.sdf.gz

          gunzip chebi_3_stars.sdf.gz

          test -s ChEBI_3stars.sdf

          echo "Downloaded SDF:"
          ls -lh ChEBI_3stars.sdf

      - name: Build Java preprocessing code
        shell: bash
        working-directory: java
        run: |
          set -euo pipefail
          mvn clean package assembly:single

      - name: Process ChEBI SDF
        id: sdf_process
        shell: bash
        run: |
          set -euo pipefail

          inputFile="ChEBI_3stars.sdf"
          outputDir="datasources/chebi/recentData"

          rm -rf "$outputDir"
          mkdir -p "$outputDir"

          java \
            -cp java/target/mapping_preprocessing-0.0.1-jar-with-dependencies.jar \
            org.sec2pri.chebi_sdf \
            "$inputFile" \
            "$outputDir" \
            "$RELEASE_NUMBER"

          echo "Successful preprocessing of ChEBI data."
          echo "FAILED=false" >> "$GITHUB_ENV"

      - name: Check generated files
        shell: bash
        run: |
          set -euo pipefail

          outputDir="datasources/chebi/recentData"

          required_files=(
            "ChEBI_priIDs.tsv"
            "ChEBI_secID2priID.tsv"
            "ChEBI_name2synonym.tsv"
            "ChEBI_secID2priID.bridge"
          )

          for file in "${required_files[@]}"; do
            path="$outputDir/$file"

            if [ ! -s "$path" ]; then
              echo "ERROR: Missing or empty output: $path"
              echo "FAILED=true" >> "$GITHUB_ENV"
              exit 1
            fi

            echo "OK: $path"
          done

          echo
          echo "Generated files:"
          ls -lh "$outputDir"

      - name: Check TSV headers
        shell: bash
        run: |
          set -euo pipefail

          outputDir="datasources/chebi/recentData"

          test "$(head -n 1 "$outputDir/ChEBI_priIDs.tsv")" \
            = $'primaryID'

          test "$(head -n 1 "$outputDir/ChEBI_secID2priID.tsv")" \
            = $'primaryID\tsecondaryID'

          test "$(head -n 1 "$outputDir/ChEBI_name2synonym.tsv")" \
            = $'primaryID\tname\tsynonym'

          echo "All TSV headers are correct."

      - name: Check ChEBI identifier format
        shell: bash
        run: |
          set -euo pipefail

          outputDir="datasources/chebi/recentData"

          wget -q \
            "https://raw.githubusercontent.com/bridgedb/datasources/main/datasources.tsv" \
            -O datasources.tsv

          CHEBI_ID=$(
            awk -F '\t' '$1 == "ChEBI" {print $10; exit}' datasources.tsv
          )

          if [ -z "$CHEBI_ID" ]; then
            echo "ERROR: Could not retrieve ChEBI regex."
            exit 1
          fi

          echo "BridgeDb ChEBI regex: $CHEBI_ID"

          tail -n +2 "$outputDir/ChEBI_priIDs.tsv" |
            cut -f1 > primary_ids.txt

          tail -n +2 "$outputDir/ChEBI_secID2priID.tsv" |
            cut -f1 > mapping_primary_ids.txt

          tail -n +2 "$outputDir/ChEBI_secID2priID.tsv" |
            cut -f2 > secondary_ids.txt

          validate_ids() {
            file="$1"
            label="$2"

            if grep -nvE "^${CHEBI_ID}$" "$file" > invalid_ids.txt; then
              echo "ERROR: Invalid ${label}:"
              cat invalid_ids.txt
              echo "FAILED=true" >> "$GITHUB_ENV"
              exit 1
            fi

            echo "All ${label} match the ChEBI identifier pattern."
          }

          validate_ids primary_ids.txt "primary IDs"
          validate_ids mapping_primary_ids.txt "mapping primary IDs"
          validate_ids secondary_ids.txt "secondary IDs"

      - name: Check mapping consistency
        shell: bash
        run: |
          set -euo pipefail

          outputDir="datasources/chebi/recentData"

          tail -n +2 "$outputDir/ChEBI_priIDs.tsv" |
            cut -f1 |
            sort -u > all_primary_ids.txt

          tail -n +2 "$outputDir/ChEBI_secID2priID.tsv" |
            cut -f1 |
            sort -u > mapped_primary_ids.txt

          if ! comm -23 mapped_primary_ids.txt all_primary_ids.txt > missing_primary_ids.txt; then
            exit 1
          fi

          if [ -s missing_primary_ids.txt ]; then
            echo "ERROR: secID2priID contains primary IDs missing from priIDs.tsv:"
            cat missing_primary_ids.txt
            echo "FAILED=true" >> "$GITHUB_ENV"
            exit 1
          fi

          echo "Every primary ID used by secID2priID.tsv occurs in priIDs.tsv."

      - name: Show output statistics
        shell: bash
        run: |
          set -euo pipefail

          outputDir="datasources/chebi/recentData"

          primary_count=$(tail -n +2 "$outputDir/ChEBI_priIDs.tsv" | wc -l)
          mapping_count=$(tail -n +2 "$outputDir/ChEBI_secID2priID.tsv" | wc -l)
          synonym_count=$(tail -n +2 "$outputDir/ChEBI_name2synonym.tsv" | wc -l)

          echo "Primary IDs:            $primary_count"
          echo "Secondary-ID mappings:  $mapping_count"
          echo "Name/synonym mappings:  $synonym_count"

      - name: Compare with current mapping
        if: env.FAILED == 'false'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x datasources/chebi/config
          . datasources/chebi/config .

          old="datasources/chebi/data/$to_check_from_zenodo"
          new="datasources/chebi/recentData/$to_check_from_zenodo"

          if [ ! -f "$old" ]; then
            echo "Current comparison file is not available: $old"
            echo "Skipping diff."
            echo "COUNT=0" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ ! -f "$new" ]; then
            echo "New comparison file is not available: $new"
            echo "FAILED=true" >> "$GITHUB_ENV"
            exit 1
          fi

          tail -n +2 "$old" |
            tr -d '\r' |
            sort -u > ids_old.txt

          tail -n +2 "$new" |
            tr -d '\r' |
            sort -u > ids_new.txt

          comm -13 ids_old.txt ids_new.txt > added.txt
          comm -23 ids_old.txt ids_new.txt > removed.txt

          count_added=$(wc -l < added.txt)
          count_removed=$(wc -l < removed.txt)
          count=$((count_added + count_removed))

          total_old=$(wc -l < ids_old.txt)

          if [ "$total_old" -gt 0 ]; then
            change=$((100 * count / total_old))
          else
            change=0
          fi

          echo "________________________________________"
          echo "Removed pairs"
          echo "________________________________________"
          if [ -s removed.txt ]; then
            cat removed.txt
          else
            echo "None"
          fi

          echo "________________________________________"
          echo "Added pairs"
          echo "________________________________________"
          if [ -s added.txt ]; then
            cat added.txt
          else
            echo "None"
          fi

          echo "________________________________________"
          echo "Added pairs:   $count_added"
          echo "Removed pairs: $count_removed"
          echo "Total changes: $count"
          echo "Change:        ${change}%"

          echo "ADDED=$count_added" >> "$GITHUB_ENV"
          echo "REMOVED=$count_removed" >> "$GITHUB_ENV"
          echo "COUNT=$count" >> "$GITHUB_ENV"
          echo "CHANGE=$change" >> "$GITHUB_ENV"

      - name: Upload all processed ChEBI data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chebi_processed
          path: datasources/chebi/recentData/
          if-no-files-found: error

      - name: Upload ChEBI name-to-synonym TSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChEBI_name2synonym
          path: datasources/chebi/recentData/ChEBI_name2synonym.tsv
          if-no-files-found: error

      - name: Upload ChEBI primary IDs TSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChEBI_priIDs
          path: datasources/chebi/recentData/ChEBI_priIDs.tsv
          if-no-files-found: error

      - name: Upload ChEBI secondary-to-primary TSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChEBI_secID2priID
          path: datasources/chebi/recentData/ChEBI_secID2priID.tsv
          if-no-files-found: error

      - name: Upload ChEBI BridgeDb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChEBI_secID2priID_bridge
          path: datasources/chebi/recentData/ChEBI_secID2priID.bridge
          if-no-files-found: error

      - name: Create or update issue
        if: env.COUNT != '0' && env.COUNT != ''
        id: create_issue
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ChEBI
        with:
          filename: .github/ISSUE_TEMPLATE/ISSUE_UPDATE.md
          update_existing: true

      - name: Bump issue with comment
        if: env.COUNT != '0' && env.COUNT != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.create_issue.outputs.number }}
          body: |
            Bump issue to notify about the changes in data.

      - name: Post issue about failing test
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ChEBI
        with:
          filename: .github/ISSUE_TEMPLATE/ISSUE_FAIL.md
          update_existing: true
